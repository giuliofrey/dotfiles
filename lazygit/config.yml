git:
  diffRenderers:
    # width: lazygit runs the pager on a pipe, so delta cannot detect a width
    #   and defaults to 80, then lazygit wraps that again. Hence the double wrap.
    #   Use $COLUMNS, which lazygit sets to the diff pane's inner width, and NOT
    #   the {{columnWidth}} template: that one is the side panel column, about
    #   0.3x the terminal (26 in a 100-column terminal against a 64-wide pane).
    # The layout below is Claude Code's own diff renderer, read out of its binary
    #   and reproduced by delta-fill. The colours were too, until reviewr arrived;
    #   they now track reviewr's tokyo-night so the two diff surfaces match.
    # reviewr derives its fills rather than listing them: it tints the theme base
    #   (#1a1b26) with the red or green anchor and steps the tint down until the
    #   row text still clears WCAG 4.5 against it, which lands on these. Recompute
    #   from readable_tint() in reviewr's src/theme.rs if the theme changes.
    #   #343f34 added row      #4a5b3e added changed-words
    #   #462d3b removed row    #6e3e4e removed changed-words
    #   #9ece6a added gutter   #f7768e removed gutter
    #   #7aa2f7 file header    #3a3b44 its underline
    # minus-style is "syntax", not "normal": leaving removed lines unhighlighted
    #   was Claude Code's choice. reviewr fills both sides and keeps the syntax on
    #   each, so matching it means highlighting removals too.
    # syntax-theme: TokyoNight, the tmTheme reviewr bundles — folke's, the same
    #   author as ghostty's and nvim's, so it is the Night variant (#1a1b26), a
    #   step darker than ghostty's Storm background. delta has no theme directory
    #   of its own and reads bat's cache, so the file lives in
    #   ~/.config/bat/themes and needs `bat cache --build` after any change.
    #   That is the only reason bat is installed.
    # max-line-distance: Claude Code bails out of word-level highlighting once
    #   more than 0.4 of the line has changed. Delta's default is 0.6, which is
    #   what was matching near-unrelated prose lines and scattering shading.
    # file-style: not omitted. With one file selected the Files panel already names
    #   it, but a range selection concatenates several files' hunks into one diff
    #   with nothing between them. The header plus underline is the separator.
    # line-numbers-*-format: one column. No literal spaces around the placeholder
    #   and no background on the number styles: delta paints only the placeholder
    #   itself, so a literal space renders as an unpainted gap between the number
    #   and the marker. delta-fill colours the whole gutter instead.
    #   Delta cannot reproduce Claude Code's old-number-on-removed-lines: with
    #   '{nm}{np}' context rows print both numbers. So removals show a blank.
    - command: >-
        delta --paging=never --width=$COLUMNS --syntax-theme='TokyoNight' --line-numbers --keep-plus-minus-markers --max-line-distance=0.4 --hunk-header-style=omit --file-style='bold #7aa2f7' --file-decoration-style='#3a3b44 ul' --plus-style='syntax #343f34' --plus-emph-style='syntax #4a5b3e' --minus-style='syntax #462d3b' --minus-emph-style='syntax #6e3e4e' --line-numbers-left-format= --line-numbers-right-format='{np:>4}' --line-numbers-plus-style='#9ece6a' --line-numbers-minus-style='#f7768e' --line-numbers-zero-style=dim | ~/.config/lazygit/delta-fill $COLUMNS 5
  # 3 lines of context shows only the change. 20 gives enough of the surrounding
  # file to scroll through it. Adjustable live with } and {.
  diffContextSize: 20
gui:
  # Expand the focused panel instead of four fixed blocks with Files empty
  # and Commits cut off after 15 chars.
  expandFocusedSidePanel: true
  # 0.3333 truncates the panel tab titles at tmux-split widths.
  sidePanelWidth: 0.4
customCommands:
  - key: "<c-v>"
    context: "global"
    command: "nvim ."
    description: "open repo in nvim"
    output: terminal
