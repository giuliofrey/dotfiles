
# agent-deck configuration
# agent-deck-tmux-config-version: 2
# Added by agent-deck installer - 2026-03-04
# https://github.com/asheshgoplani/agent-deck

# Terminal with true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm*:Tc:smcup@:rmcup@"
set -ag terminal-overrides ",*256col*:Tc"

# Performance
set -sg escape-time 0
set -g history-limit 50000

# Panes run fish. tmux otherwise spawns $SHELL, which is /bin/zsh here, so
# panes were dropping into zsh even though ghostty launches fish.
set -g default-shell /opt/homebrew/bin/fish

# Claude Code drops to 256 colours whenever $TMUX is set, regardless of TERM,
# COLORTERM or FORCE_COLOR, which is why its logo and output look flat in a
# pane. This is its documented opt-out. Measured: 0 truecolor escapes without
# it, 18 with. tmux itself passes 24-bit through fine either way.
set-environment -g CLAUDE_CODE_TMUX_TRUECOLOR 1

# Mouse support (scroll + drag-to-copy)
set -g mouse on

# Auto-enter copy-mode when scrolling up (critical for WSL compatibility)
# This handles: 1) apps with mouse support, 2) already in copy-mode, 3) normal pane
bind-key -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

# Scroll bindings in copy-mode (both vi and emacs modes)
bind-key -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X scroll-down
bind-key -T copy-mode WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode WheelDownPane send-keys -X scroll-down

# Clipboard integration (drag-to-copy)
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
# End agent-deck configuration


# ---------------------------------------------------------------- keys ------
# C-Space instead of C-b: C-b is readline's back-one-char, C-a its
# beginning-of-line. C-Space collides with neither.
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

set -g base-index 1              # windows numbered from 1
setw -g pane-base-index 1
set -g renumber-windows on       # close window 2 of 3, the third becomes 2

bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# Splits and new windows inherit the current pane's directory. This is what
# replaces the ghostty split-pane workflow.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# -r = repeatable, so h/j/k/l can be held without re-pressing the prefix
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# The h/j/k/l and H/J/K/L pane bindings above overwrite tmux's defaults for
# l (last-window) and L (last-session). Both are the fastest way to bounce
# between two things, so put them back on Tab.
bind Tab last-window
bind BTab switch-client -l

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel pbcopy

# ------------------------------------------------------------- sessions -----
# prefix+s is tmux's built-in choose-tree: every session and window, with a
# live preview. That is the picker for sessions that already exist.
bind s choose-tree -Zs

# prefix+f opens the project picker: every git repo under ~/personal and
# ~/projects, most recently committed first. See tmux/sessionizer.
#
# display-popup, not run-shell: fzf needs a tty and run-shell has none. -E
# closes the popup when the script exits.
bind f display-popup -E -w 70% -h 60% "~/.config/tmux/sessionizer"

# prefix+F opens the lazygit/claude split for the directory this pane is already
# in, skipping the picker. run-shell, not display-popup: there is no fzf here, so
# nothing needs a tty, and run-shell expands #{pane_current_path} for us.
bind F run-shell "~/.config/tmux/sessionizer '#{pane_current_path}'"

# ---------------------------------------------------------------- theme -----
# tmux sets no colours of its own. `default` means the terminal's own fg/bg, so
# ghostty's theme comes through untouched and nothing has to be re-tuned when it
# switches between TokyoNight Storm and Day.
#
# Emphasis is done with attributes instead: bold for the current window,
# reverse for copy-mode selection. Both are drawn from whatever colours the
# terminal is already using, so they impose nothing.
#
# The active pane is marked with arrows on its border rather than a tint, which
# is the only way to keep a focus indicator without picking a colour.
set -g status-position top
# The status bar otherwise sits straight on top of the panes with nothing
# between them. `underscore` rules off the whole row, empty span included, so it
# separates like a pane border does without spending a second status line on a
# row of box-drawing characters.
set -g status-style "bg=default,fg=default,underscore"
set -g status-left "#[fg=colour4,bold] #S #[default]"
set -g status-left-length 30
set -g status-right " %H:%M "
set -g window-status-format " #I #W "
set -g window-status-current-format "#[fg=colour4,bold] #I #W "
set -g window-status-activity-style bold
set -g pane-border-style default
set -g pane-active-border-style "fg=colour4"
set -g pane-border-indicators colour
set -g message-style "bg=default,fg=colour4"
set -g mode-style reverse

# -------------------------------------------------------------- plugins -----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# Dropped tmux-sensible: tmux 3.7 ships nearly all of its defaults upstream.

set -g @continuum-restore 'on'   # restore the last saved layout on server start
set -g @resurrect-capture-pane-contents 'on'

# Keep this at the very bottom.
run '~/.config/tmux/plugins/tpm/tpm'
