
# agent-deck configuration
# agent-deck-tmux-config-version: 2
# Added by agent-deck installer - 2026-03-04
# https://github.com/asheshgoplani/agent-deck

# Terminal with true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm*:Tc:smcup@:rmcup@"
set -ag terminal-overrides ",*256col*:Tc"

# Performance
set -sg escape-time 0
set -g history-limit 50000

# Panes run fish. tmux otherwise spawns $SHELL, which is /bin/zsh here.
#
# fish's prefix differs per platform, so test each and let the last match win.
# Plain `if`, not `if -b`: backgrounded checks finish in any order.
if 'test -x /usr/bin/fish'          'set -g default-shell /usr/bin/fish'
if 'test -x /usr/local/bin/fish'    'set -g default-shell /usr/local/bin/fish'
if 'test -x /opt/homebrew/bin/fish' 'set -g default-shell /opt/homebrew/bin/fish'

# Claude Code drops to 256 colours whenever $TMUX is set, regardless of TERM or
# COLORTERM. This is its documented opt-out; tmux passes 24-bit through either way.
set-environment -g CLAUDE_CODE_TMUX_TRUECOLOR 1

# Mouse support (scroll + drag-to-copy)
set -g mouse on

# Scrolling up enters copy-mode, unless the app handles the mouse itself
bind-key -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

# Scroll bindings in copy-mode (both vi and emacs modes)
bind-key -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X scroll-down
bind-key -T copy-mode WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode WheelDownPane send-keys -X scroll-down

# set-clipboard on lets tmux write the system clipboard over OSC 52: no
# pbcopy/wl-copy/xclip to pick per platform, and it works over SSH. The default
# `external` leaves tmux's own copies sitting in the tmux buffer.
set -g set-clipboard on
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
# End agent-deck configuration


# ---------------------------------------------------------------- keys ------
# C-Space instead of C-b: C-b is readline's back-one-char, C-a its
# beginning-of-line. C-Space collides with neither.
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

set -g base-index 1              # windows numbered from 1
setw -g pane-base-index 1
set -g renumber-windows on       # close window 2 of 3, the third becomes 2

bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# Splits and new windows inherit the current pane's directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# -r = repeatable, so h/j/k/l can be held without re-pressing the prefix
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# The bindings above overwrite tmux's l (last-window) and L (last-session).
# Both are the fastest way to bounce between two things, so put them on Tab.
bind Tab last-window
bind BTab switch-client -l

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ------------------------------------------------------------- sessions -----
# Pickers come from sainnhe/tmux-fzf, cloned into tmux/plugins. That directory
# is gitignored, so this is the one part of the config a new machine has to
# fetch again rather than inherit; the clone command is in the README.
#
# The assignments must precede the run-shell: main.tmux reads them when it binds
# its launch key. tmux parses a bare NAME=value into its global environment,
# which run-shell inherits.
#
# C-f because prefix+F is already the sessionizer split.
TMUX_FZF_LAUNCH_KEY="C-f"
TMUX_FZF_ORDER="session|window|pane"
TMUX_FZF_SWITCH_CURRENT=1
# The leading "#S:" is load-bearing: session.sh takes everything before the first
# colon as the target, and .preview-session strips from ": " to find the pane.
TMUX_FZF_SESSION_FORMAT="#{session_windows}w #{s|/Users/giulio|~|:session_path}"
# Previews are full of East Asian Ambiguous glyphs, which fzf and the terminal
# can size differently; one cell of disagreement in a nowrap preview paints over
# the boundary. 0 pins fzf to single-width. fzf-tmux forwards this only when it
# is already set.
RUNEWIDTH_EASTASIAN=0
# fzf-tmux runs display-popup with -B and puts --border on fzf instead, costing a
# column at each edge, and border-left costs one more between the lists: 163 - 3
# leaves 160, split 42 and 118. nowrap stops a full-width TUI row folding onto
# two. scripts/.envs appends --preview-window=:follow after this, which fzf
# merges into the value here rather than replacing it.
TMUX_FZF_OPTIONS="-p -w 163 -h 37 -m --preview-window=right,118,border-left,nowrap"
run-shell ~/.config/tmux/plugins/tmux-fzf/main.tmux

# prefix+C-f opens the plugin's full menu; s and w pass the action as an argument
# to skip it. TMUX_FZF_CLIENT pins the popup to the client that pressed the key,
# since run-shell -b has none of its own and would otherwise use whichever client
# was last active.
bind s run-shell -b "TMUX_FZF_CLIENT='#{client_tty}' ~/.config/tmux/plugins/tmux-fzf/scripts/session.sh switch"
bind w run-shell -b "TMUX_FZF_CLIENT='#{client_tty}' ~/.config/tmux/plugins/tmux-fzf/scripts/window.sh switch"

# prefix+f opens the project picker; see tmux/sessionizer. display-popup, not
# run-shell: fzf needs a tty and run-shell has none. -E closes the popup when
# the script exits.
bind f display-popup -E -w 70% -h 60% "~/.config/tmux/sessionizer"

# prefix+F opens the lazygit/claude split for this pane's directory, skipping the
# picker. run-shell, not display-popup: no fzf here, so nothing needs a tty, and
# run-shell expands #{pane_current_path}.
bind F run-shell "~/.config/tmux/sessionizer '#{pane_current_path}'"

# ---------------------------------------------------------------- theme -----
# tmux sets no colours of its own: `default` means the terminal's own fg/bg, so
# ghostty's theme comes through untouched and nothing needs re-tuning when it
# switches between TokyoNight Storm and Day. Emphasis uses attributes instead
# (bold, reverse), and the active pane is marked with border arrows rather than
# a tint, which keeps a focus indicator without picking a colour.
set -g status-position top
# `underscore` rules off the whole row, empty span included, so the status bar
# separates from the panes without spending a second line on box-drawing. us=
# sets the rule's own colour; without it the rule takes the colour of whatever
# text sits in front of it and comes out patchy.
set -g status-style "bg=default,fg=default,underscore,us=colour8"
set -g status-left "#[fg=colour4,bold] #S #[default]"
set -g status-left-length 30
set -g status-right " %H:%M "
set -g window-status-format " #I #W "
set -g window-status-current-format "#[fg=colour4,bold] #I #W "
set -g window-status-activity-style bold
set -g pane-border-style default
set -g pane-active-border-style "fg=colour4"
set -g pane-border-indicators colour
set -g message-style "bg=default,fg=colour4"
set -g mode-style reverse

# No tpm. resurrect/continuum got restored layouts wrong often enough that
# starting clean is better, and tpm went with them. tmux-fzf is the exception
# and does not bring tpm back: it is a plain clone loaded by the run-shell
# above, and it only draws pickers, so it has no state to restore wrongly.
