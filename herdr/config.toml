onboarding = false
# herdr configuration. Reload in place with prefix+shift+r or
# `herdr server reload-config`. Settings that describe how a pane is created
# (default_shell, new_cwd) only reach panes opened after the reload; the only
# setting herdr documents as needing a full relaunch is sidebar_start_collapsed.
#
# herdr replaces tmux for agent work rather than nesting inside it: both are
# multiplexers, and two prefix keys in one terminal is a fight nobody wins.
# tmux stays for everything else, which is why the keys below mirror tmux.conf.

[terminal]
# $SHELL is /bin/zsh on this machine, so panes would come up in zsh. tmux.conf
# sets default-shell for the same reason.
default_shell = "/opt/homebrew/bin/fish"

[theme]
# Same rule as the tmux status line: herdr picks no colours of its own, so
# ghostty's TokyoNight Storm/Day switch comes through untouched and nothing
# needs re-tuning when the system flips appearance.
name = "terminal"
auto_switch = false
[keys]
# C-Space, matching tmux.conf: C-b is readline's back-one-char, C-a its
# beginning-of-line.
prefix = "ctrl+space"
# prefix+hjkl focus, prefix+minus horizontal split and prefix+z zoom are already
# herdr defaults and already match tmux.conf. The vertical split stays on
# prefix+v rather than tmux's prefix+| because herdr does not accept | as a key.

# prefix+j/k walk the sidebar agent list. herdr ships next_agent and
# previous_agent unbound, so there was no way to reach an agent without the
# mouse or the workspace picker. That means giving up focus_pane_down/up, which
# is the trade worth making: splits here are side by side and prefix+hl covers
# them, while the agent list is the vertical thing actually worth walking.
# Not alt+1..9, herdr's suggested focus_agent binding: ghostty here has no
# macos-option-as-alt, so alt chords never arrive.
next_agent = "prefix+j"
previous_agent = "prefix+k"
focus_pane_down = ""
focus_pane_up = ""

# prefix+1..9 focus agents by sidebar position instead of tabs. With priority
# sorting, prefix+1 is the most urgent agent; pressing it again after viewing a
# done agent moves to the next one. Tabs stay on prefix+n/p and prefix+g then 1..9.
focus_agent = "prefix+1..9"
switch_tab = ""

# prefix+o opens the visible in-app toast's target, NOT notification history.
# Herdr 0.9.3 only stores this target with ui.toast.delivery = "herdr";
# terminal/system delivery below leaves the action with nothing to open.
# The less-used nvim file picker lives on prefix+shift+o below.
open_notification_target = "prefix+o"

# prefix+f, the project picker, same key as tmux.conf. Now josephschmitt/pj-herdr
# rather than the hand-rolled herdr/pick it replaced: pj caches its own discovery
# (5 min TTL, 0.007s warm against 0.45s for the find + git-log walk pick did), and
# the plugin's picker carries actions pick had no way to offer — ctrl-w opens the
# project as a herdr worktree, ctrl-n forces a second workspace, ctrl-t a tab.
#
# Television, not fzf, in plugins/config/pj/config: those extra actions are the
# tv channel's keybindings and simply do not exist in the plugin's fzf path.
#
# What it costs: pj sorts alphabetically, so the by-last-commit ordering that
# tmux/sessionizer explains at length is gone here. It also only finds what its
# markers match, tuned in ~/.config/pj/config.yaml.
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "pj.open-picker"
description = "project picker"

# prefix+a opens a compact chooser for every installed coding harness, then
# starts the choice in a full-width tab rooted at the active pane's cwd. The
# chooser keeps a most-recently-used order, so pressing prefix+a then Enter
# immediately starts another copy of whichever harness was chosen last.
#
# A tab rather than a split keeps Herdr's unseen/done tracking independent for
# each agent. `pane run` types into that tab's shell, so quitting the harness
# leaves a fish prompt instead of closing the tab.
[[keys.command]]
key = "prefix+a"
type = "popup"
command = "$HOME/.config/herdr/harness-picker"
description = "Choose Harness"
width = "36%"
height = "40%"

# prefix+shift+a, the background sessions for the workspace you are in. herdr
# cannot list them itself: its claude integration is a hook that exits unless
# HERDR_PANE_ID is set, and a session dispatched from the agent view has no
# pane, so the sidebar never sees one. This is the way to reach them.
#
# --cwd matches sessions started *under* a path, and agents are dispatched from
# the workspace root, so the git root is the right anchor and the pane cwd is
# not: hit this from a subdirectory and a plain $HERDR_ACTIVE_PANE_CWD would
# quietly match nothing. Falls back to the pane cwd outside a repo.
#
# A popup, like lazygit on prefix+d: you come here to unblock something and
# leave, not to work.
[[keys.command]]
key = "prefix+shift+a"
type = "popup"
command = "d=$HERDR_ACTIVE_PANE_CWD; r=$(git -C \"$d\" rev-parse --show-toplevel 2>/dev/null) && d=$r; claude agents --cwd \"$d\""
description = "background agents here"
width = "90%"
height = "90%"

# prefix+space, tmux's next-layout: even-horizontal, even-vertical,
# main-horizontal, main-vertical, tiled. herdr has no layout concept of its own,
# so herdr/flip rebuilds each one pane by pane; see its docstring for how, and
# for what it costs.
#
# type = "shell", like prefix+t: the script talks to the API and has nothing to
# draw, so it wants no pane of its own.
#
# prefix+space reads as a chord on a ctrl+space prefix, and it is: herdr takes
# the prefix key and the bound key separately, so the space is not swallowed.
[[keys.command]]
key = "prefix+space"
type = "shell"
command = "$HOME/.config/herdr/flip"
description = "next pane layout"

# lazygit moves from the sessionizer's permanent left pane to a popup: the
# herdr sidebar already carries branch and git status, so that pane sat idle
# most of the time and cost half the width.
#
# prefix+d, not the obvious prefix+g: that is herdr's own goto/navigate mode.
# herdr's example config puts lazygit on prefix+alt+g to dodge the same clash,
# but ghostty here has no macos-option-as-alt, so alt chords never arrive.
[[keys.command]]
key = "prefix+d"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"

[ui]
# prefix+b hides the sidebar completely instead of leaving a narrow rail.
sidebar_collapsed_mode = "hidden"

# >>> herdr-radar tab-bar block
tab_bar_right_separator = " · "
tab_bar_right = [
  { type = 'command', command = 'cat "/Users/giulio/.local/state/herdr/plugins/hhdebb.herdr-radar/tabbar.txt"', interval_seconds = 6, timeout_seconds = 2 },
]
# <<< herdr-radar tab-bar block

# The sidebar is the reason to run herdr at all, so give it the branch and
# status line the tmux status bar never had.
agent_panel_sort = "priority"
# prefix+c opens a tab straight away instead of stopping for a name. herdr's
# generated names are numbers, which is what tmux does and what the tab row was
# already showing; prefix+shift+t still renames one that earns a real name.
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = false
# Sidebar rows are managed by herdr-radar at the end of this file.

[ui.toast]
# Desktop notifications when a background agent finishes or blocks. The
# Notification hook in ~/.claude/settings.json only rings the bell, which is
# useless once the pane is off-screen.
delivery = "terminal"

# The herdr side of ChmaraX/herdr-nvim, installed with `herdr plugin install`.
# prefix+e opens nvim as a sidebar pane, prefix+shift+o jumps to a file path printed
# in the agent's output. The nvim side lives in nvim/lua/plugins/herdr.lua and
# is remapped off <leader>a there, since claudecode already holds that group.
[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

# prefix+r, reviewr's diff pane (persiyanov.reviewr). Lowercase only: herdr's own
# config reload is prefix+shift+r, so the two do not collide. reviewr's own
# settings — theme, navigator side — live in its plugin config dir, not here.
[[keys.command]]
key = "prefix+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "reviewr: toggle diff pane"

# prefix+t, the Pythia job queue in a split to the right. `ssh pythia` carries
# the key, user and SetEnv TERM from ~/.ssh/config, so only the command is here.
#
# type = "shell", not "pane": a type="pane" command opens a *zoomed* pane and a
# keybinding has no placement option, so the split has to go through the API.
# Same two-step as herdr/pick — split, take the new pane id out of the JSON,
# then `pane run` into it. IDs are opaque, so read it rather than predict it.
#
# -t forces a TTY: ssh allocates one for a bare login but not when a command
# follows, and turm is a TUI that draws nothing without one.
#
# No failure guard, unlike a type="pane" version would need: `pane run` types
# into a real shell pane, so an ssh that fails with the Booth VPN down leaves
# the error on screen at a prompt instead of closing the pane under it.
#
# Not prefix+p: that is herdr's own previous_tab.
[[keys.command]]
key = "prefix+t"
type = "shell"
command = "herdr pane run $(herdr pane split --pane $HERDR_ACTIVE_PANE_ID --direction right --focus | jq -r .result.pane.pane_id) 'ssh -t pythia turm --me'"
description = "pythia: my slurm jobs"

